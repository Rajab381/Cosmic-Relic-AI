<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cosmic Relic AI</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>

<body>

<div class="scan-line"></div>

<div class="background-grid"></div>

<div class="background-glow"></div>

<div class="particles"></div>

<div class="container">

    <!-- =====================================================
         LEFT SIDEBAR / COSMIC DASHBOARD
    ====================================================== -->

    <aside class="sidebar" id="sidebar">

        <div class="cosmic-brand">

            <div class="cosmic-emblem">
                <div class="emblem-core"></div>
                <div class="emblem-ring"></div>
            </div>

            <div>
                <h2>COSMIC RELIC</h2>
                <p class="version">AI OS • SIX CORES</p>
            </div>

        </div>

        <hr class="sidebar-hr">

        <input type="file"
               id="pdfFile"
               accept=".pdf"
               onchange="uploadPDF()"
               hidden>

        <div class="upload-card"
             onclick="document.getElementById('pdfFile').click()"
             role="button"
             tabindex="0"
             title="Upload PDF document for semantic RAG">

            <div class="upload-icon">📄</div>

            <h3>Upload Document</h3>

            <p id="uploadStatusText">PDF • Semantic RAG</p>

        </div>

        <button class="dash-btn" onclick="document.getElementById('pdfFile').click()">📄 Upload PDF</button>

        <button class="dash-btn primary-btn" onclick="startChat()">💬 New Chat</button>

        <button class="dash-btn" id="memBtn" onclick="inspectCore('time')">🧠 Memory</button>

        <button class="dash-btn" id="toolsBtn" onclick="inspectCore('power')">🧮 Tools</button>

        <button class="dash-btn" id="settingsBtn" onclick="inspectCore('mind')">⚙ Settings</button>

        <div class="sidebar-cores-panel">
            <div class="sidebar-cores-label">INTELLIGENCE CORES</div>
            <div class="sidebar-cores-grid">
                <button class="sidebar-core-pill" data-core="space" onclick="inspectCore('space')"><span class="pill-dot space-dot"></span>SPACE</button>
                <button class="sidebar-core-pill" data-core="reality" onclick="inspectCore('reality')"><span class="pill-dot reality-dot"></span>REALITY</button>
                <button class="sidebar-core-pill" data-core="power" onclick="inspectCore('power')"><span class="pill-dot power-dot"></span>POWER</button>
                <button class="sidebar-core-pill" data-core="mind" onclick="inspectCore('mind')"><span class="pill-dot mind-dot"></span>MIND</button>
                <button class="sidebar-core-pill" data-core="time" onclick="inspectCore('time')"><span class="pill-dot time-dot"></span>TIME</button>
                <button class="sidebar-core-pill" data-core="soul" onclick="inspectCore('soul')"><span class="pill-dot soul-dot"></span>SOUL</button>
            </div>
        </div>

    </aside>


    <!-- =====================================================
         MAIN CHAT AREA
    ====================================================== -->

    <main class="chat-area"
          id="chatArea">

        <div id="landingScreen">

            <div class="header"
                 id="hero">

                <!--
                    cosmic-interface.js creates the entire
                    cosmic environment inside this element.
                -->

                <div class="cosmic-title-space"></div>

            </div>

        </div>


        <!-- =================================================
             CHAT WORKSPACE
        ================================================== -->

        <div id="workspace"
             class="hidden-workspace">

            <div id="response"></div>

            <div class="input-box">

                <button class="icon-btn"
                        type="button"
                        onclick="document.getElementById('pdfFile').click()"
                        title="Attach Document">
                    📎
                </button>

                <input id="message"
                       type="text"
                       placeholder="Ask Cosmic Relic anything..."
                       autocomplete="off">

                <button class="icon-btn mic-btn"
                        type="button"
                        title="Voice Interface">
                    🎤
                </button>

                <button class="send-btn"
                        type="button"
                        onclick="sendMessage()"
                        title="Send Message">
                    ➜
                </button>

            </div>

        </div>

    </main>

</div>


<!-- =========================================================
     SCRIPTS
========================================================= -->

<script src="{{ url_for('static', filename='js/cosmic-interface.js') }}"></script>

<script src="{{ url_for('static', filename='js/app.js') }}"></script>

<div class="cursor-glow"></div>

</body>
</html>
